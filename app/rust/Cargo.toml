[package]
name = "crosschat_ffi"
description = "flutter_rust_bridge facade over crosschat-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
crosschat-core = { path = "../../crates/crosschat-core" }
anyhow.workspace = true
tokio.workspace = true
serde_json.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

# HTTPS on Android: reqwest (matrix-sdk) verifies certificates with
# rustls-platform-verifier, which needs the app context (see src/android_tls.rs).
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
rustls-platform-verifier = "0.7"
