name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FLUTTER_VERSION: "3.47.6"

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Validate bridge manifests
        run: cargo run -q -p crosschatd -- validate manifests

  e2e:
    name: End-to-end (Tuwunel + crosschatd + gmessages)
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch Tuwunel (pinned, checksum-verified)
        run: |
          set -euo pipefail
          url=https://github.com/matrix-construct/tuwunel/releases/download/v1.9.3/v1.9.3-release-all-x86_64-v1-linux-gnu-tuwunel.zst
          curl -fsSL "$url" -o tuwunel.zst
          echo "98c3b0be352cc03b2c6b21d6f2ed60fedc926f4aab61ce37f0b89eed97d5b756  tuwunel.zst" | sha256sum -c -
          zstd -d tuwunel.zst -o "$RUNNER_TEMP/tuwunel" && chmod +x "$RUNNER_TEMP/tuwunel"
      - name: Smoke test
        run: TUWUNEL_BIN="$RUNNER_TEMP/tuwunel" scripts/smoke.sh
      - name: Logs on failure
        if: failure()
        run: |
          tail -n 200 smoke/crosschatd.log || true
          tail -n 100 smoke/data/bridges/*/bridge.log || true

  flutter:
    name: Flutter (analyze, test, Linux build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Linux desktop deps
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
      - working-directory: app
        run: flutter pub get
      - working-directory: app
        run: flutter analyze
      - working-directory: app
        run: flutter test
      - working-directory: app
        run: flutter build linux --release
      - uses: actions/upload-artifact@v4
        with:
          name: crosschat-linux-x64
          path: app/build/linux/x64/release/bundle

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - working-directory: app
        run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: crosschat-android-apks
          path: app/build/app/outputs/flutter-apk/*.apk

  macos:
    name: macOS (cargo test, flutter build macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Rust tests on macOS (core + crosschatd)
        run: cargo test --workspace
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - working-directory: app
        run: flutter build macos --release
      - name: Zip unsigned app
        run: ditto -c -k --sequesterRsrc --keepParent app/build/macos/Build/Products/Release/crosschat.app crosschat-macos-unsigned.zip
      - uses: actions/upload-artifact@v4
        with:
          name: crosschat-macos-unsigned
          path: crosschat-macos-unsigned.zip
