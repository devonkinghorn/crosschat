name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      prebuilt_tag:
        description: >-
          Build the prebuilt binaries (scripts/build-prebuilt.sh) and attach
          them to this pre-release tag, e.g. prebuilt-v2. Empty = normal CI.
        required: false
        default: ""

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FLUTTER_VERSION: "3.47.6"

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Validate bridge manifests
        run: cargo run -q -p crosschatd -- validate manifests

  e2e:
    name: End-to-end (Tuwunel + crosschatd + gmessages)
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch Tuwunel (pinned, checksum-verified)
        run: |
          set -euo pipefail
          url=https://github.com/matrix-construct/tuwunel/releases/download/v1.9.3/v1.9.3-release-all-x86_64-v1-linux-gnu-tuwunel.zst
          curl -fsSL "$url" -o tuwunel.zst
          echo "98c3b0be352cc03b2c6b21d6f2ed60fedc926f4aab61ce37f0b89eed97d5b756  tuwunel.zst" | sha256sum -c -
          zstd -d tuwunel.zst -o "$RUNNER_TEMP/tuwunel" && chmod +x "$RUNNER_TEMP/tuwunel"
      - name: Smoke test
        run: TUWUNEL_BIN="$RUNNER_TEMP/tuwunel" scripts/smoke.sh
      - name: Logs on failure
        if: failure()
        run: |
          tail -n 200 smoke/crosschatd.log || true
          tail -n 100 smoke/data/bridges/*/bridge.log || true

  flutter:
    name: Flutter (analyze, test, Linux build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Linux desktop deps
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
      - working-directory: app
        run: flutter pub get
      - working-directory: app
        run: flutter analyze
      - working-directory: app
        run: flutter test
      - working-directory: app
        run: flutter build linux --release
      - uses: actions/upload-artifact@v4
        with:
          name: crosschat-linux-x64
          path: app/build/linux/x64/release/bundle

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - working-directory: app
        run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: crosschat-android-apks
          path: app/build/app/outputs/flutter-apk/*.apk

  macos:
    name: macOS (cargo test, flutter build macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Rust tests on macOS (core + crosschatd)
        run: cargo test --workspace
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - working-directory: app
        run: flutter build macos --release
      - name: Bundle crosschatd, Tuwunel and default bridges (prebuilt, no compiling)
        run: scripts/bundle-local-server.sh
      - name: Zip unsigned app
        run: ditto -c -k --sequesterRsrc --keepParent app/build/macos/Build/Products/Release/crosschat.app crosschat-macos-unsigned.zip
      - uses: actions/upload-artifact@v4
        with:
          name: crosschat-macos-unsigned
          path: crosschat-macos-unsigned.zip

  # ---- Prebuilt binaries for the prebuilt-vN release (manual) ----
  # Users never compile: crosschatd downloads these (SHA-256 pinned in
  # manifests/*.yaml and tuwunel.rs) and the macOS app bundles the default ones.

  prebuilt-macos:
    name: Prebuilt (macOS bridges + Tuwunel)
    if: github.event_name == 'workflow_dispatch' && inputs.prebuilt_tag != ''
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: scripts/build-prebuilt.sh --no-package --out dist/prebuilt darwin-arm64 darwin-amd64
      - uses: actions/upload-artifact@v4
        with:
          name: prebuilt-darwin
          path: dist/prebuilt/[mt]*

  prebuilt-linux:
    name: Prebuilt (Linux bridges without upstream releases)
    if: github.event_name == 'workflow_dispatch' && inputs.prebuilt_tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: false
      - uses: mlugg/setup-zig@v2
      - run: scripts/build-prebuilt.sh --bridges --no-package --out dist/prebuilt linux-amd64 linux-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: prebuilt-linux
          path: dist/prebuilt/[mt]*

  prebuilt-release:
    name: Prebuilt (package + attach to pre-release)
    needs: [prebuilt-macos, prebuilt-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist/prebuilt
          merge-multiple: true
      - run: scripts/build-prebuilt.sh --package --out dist/prebuilt
      - name: Compare with the pins in the repo
        run: diff prebuilt/SHA256SUMS dist/prebuilt/SHA256SUMS || echo "::warning::hashes differ from prebuilt/SHA256SUMS; update the manifests if you publish these"
      - name: Attach to the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.prebuilt_tag }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --prerelease --title "Prebuilt binaries ($TAG)" --notes-file prebuilt/RELEASE_NOTES.md
          gh release upload "$TAG" --clobber dist/prebuilt/*.zst dist/prebuilt/SHA256SUMS
