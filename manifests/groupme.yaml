# GroupMe via beeper/groupme (bridgev2 rewrite, revived 2026; AGPL-3.0).
# Upstream publishes no release binaries yet, so Crosschat's prebuilt-v1
# release carries builds of the pinned commit (scripts/build-prebuilt.sh,
# -tags goolm, static musl on Linux). Nothing is compiled on users' machines.
schema: crosschat.bridge/v1
id: groupme
display_name: GroupMe
network: groupme
description: GroupMe groups and DMs. Early bridge; DMs are not fully validated upstream yet.
framework: bridgev2
license: AGPL-3.0
homepage: https://github.com/beeper/groupme
maturity: alpha
host_platforms: [linux, macos]
source:
  kind: github-release
  repo: devonkinghorn/crosschat
  version: prebuilt-v1
  # Built from https://github.com/beeper/groupme at
  # ff4fbcc6211d7e24fb0c240f6dc15e95555962db.
  artifacts:
    linux-amd64: mautrix-groupme-ff4fbcc6211d-linux-amd64.zst
    linux-arm64: mautrix-groupme-ff4fbcc6211d-linux-arm64.zst
    darwin-arm64: mautrix-groupme-ff4fbcc6211d-darwin-arm64.zst
    darwin-amd64: mautrix-groupme-ff4fbcc6211d-darwin-amd64.zst
  sha256:
    linux-amd64: 61beb2524b1010c339244d3f8a796acb88282db2b16c415d3ded7c9b34d9137b
    linux-arm64: 40f79162b17f926543d631acef2a7dc37f78e632033c21ed206171f64e831ff6
    darwin-arm64: 370f5942981d19beabeed1cf57619dc5443361fc56ccac7b685a9c25e4715505
    darwin-amd64: 5951dbf42c3dd833659a46bdaa0ca50bdb1757c925cb7f109e1d5bc32c536ee3
process:
  binary: mautrix-groupme
  args: ["-c", "{{config}}", "-r", "{{registration}}", "--no-update"]
  generate_example_config: ["-e", "-c", "{{config}}"]
  default_port: 29331
registration:
  bot_username: groupmebot
  username_template: "groupme_{{.}}"
config:
  matrix:
    federate_rooms: false
  encryption:
    allow: true
    default: true
login:
  flows:
    - id: access-token
      title: GroupMe access token
      help: >-
        Recommended. Sign in at web.groupme.com, copy the `access_token`
        value from local storage, and paste it here.
    - id: web
      title: GroupMe web sign-in
      help: Embedded web sign-in. Google sign-in is blocked inside embedded browsers.
capabilities:
  threads: no
  replies: yes
  reactions: yes
  edits: no
  contacts: unknown
  search_users: unknown
  create_group: unknown
preflight:
  - id: early_bridge
    severity: warning
    message: >-
      The GroupMe bridge is early: group text, images, files, reactions and
      replies are tested upstream; DMs and some features are not fully
      validated, and there is no history backfill yet.
