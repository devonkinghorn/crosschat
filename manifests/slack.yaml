# Slack via mautrix-slack (AGPL-3.0, downloaded at install time).
schema: crosschat.bridge/v1
id: slack
display_name: Slack
network: slack
description: Slack workspaces, with Slack threads mapped to Matrix threads.
framework: bridgev2
license: AGPL-3.0
homepage: https://github.com/mautrix/slack
maturity: stable
host_platforms: [linux, macos]
source:
  kind: github-release
  repo: mautrix/slack
  version: v0.2609.1
  checksums: sha256sums.txt
  artifacts:
    linux-amd64: mautrix-slack-amd64
    linux-arm64: mautrix-slack-arm64
    linux-armv7: mautrix-slack-arm
    darwin-arm64: mautrix-slack-darwin-arm64
# Upstream's darwin binaries link libolm from Homebrew, which Homebrew no
# longer ships, so macOS uses Crosschat's builds of the same tag with the
# pure-Go olm (-tags goolm), made by scripts/build-prebuilt.sh.
source_overrides:
  darwin-arm64: &macos
    kind: github-release
    repo: devonkinghorn/crosschat
    version: prebuilt-v1
    artifacts:
      darwin-arm64: mautrix-slack-v0.2609.1-darwin-arm64.zst
      darwin-amd64: mautrix-slack-v0.2609.1-darwin-amd64.zst
    sha256:
      darwin-arm64: 2cabf0c515b05576cb4b2a3b5dd0a3f435646cf1a69b0597490e8163ec7dbb4f
      darwin-amd64: f8987300cbcd1b7585f6049c50a6a159d34dec9ba52470b8a9cbaac1d71bb6e3
  darwin-amd64: *macos
process:
  binary: mautrix-slack
  args: ["-c", "{{config}}", "-r", "{{registration}}", "--no-update"]
  generate_example_config: ["-e", "-c", "{{config}}"]
  default_port: 29335
registration:
  bot_username: slackbot
  username_template: "slack_{{.}}"
config:
  matrix:
    federate_rooms: false
  encryption:
    allow: true
    default: true
  backfill:
    enabled: true
login:
  flows:
    - id: token
      title: Slack web session (token + d cookie)
      help: >-
        Sign in to Slack in an embedded browser; Crosschat captures the xoxc
        token and the `d` cookie for the bridge.
    - id: email
      title: Email confirmation code
    - id: app
      title: Slack app (bot + app token)
capabilities:
  threads: yes
  replies: yes
  reactions: yes
  edits: yes
  contacts: yes
  search_users: yes
  create_group: no
preflight:
  - id: workspace_policy
    severity: warning
    message: >-
      The bridge uses your personal Slack web session. Some company
      workspaces detect or prohibit unofficial clients; check your
      workspace's policy first.
